version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 288761729262.dkr.ecr.eu-central-1.amazonaws.com
  build:
    commands:
      - docker build -t 288761729262.dkr.ecr.eu-central-1.amazonaws.com/portfolio-app:latest .
      
  post_build:
    commands:
      - docker push 288761729262.dkr.ecr.eu-central-1.amazonaws.com/portfolio-app:latest
      - printf '[{"name":"portfolio","imageUri":"%s"}]' 288761729262.dkr.ecr.eu-central-1.amazonaws.com/portfolio-app:latest > imagedefinitions.json
artifacts:
  files: 
    - imagedefinitions.json
    - appspec.yaml
